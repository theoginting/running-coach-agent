# fly.toml app configuration file generated for running-coach-mcp on 2026-07-25T19:56:51-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'running-coach-mcp'
primary_region = 'sjc'

[build]
[env]
  MEMORY_FILE = '/data/.memory.json'
  PORT = '8080'
  WHOOP_TOKENS_FILE = '/data/.whoop_tokens.json'

[[mounts]]
  source = 'coach_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
